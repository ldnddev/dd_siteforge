# Test the workspace on every pull request and on master.
# release.yml and pages.yml are unchanged. The musl job below builds the
# same x86_64 Linux target as the release archive, without uploading it.

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      # The tree already fails `cargo clippy -- -D warnings`. This step
      # fails on clippy errors and stays green for those existing lints.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        # --no-fail-fast so a core or theme failure is still reported when the
        # known Omarchy theme test fails on a runner that has no Omarchy install.
        run: cargo test --workspace --locked --no-fail-fast

  # Separate job so a failing test (the Omarchy theme check on runners
  # without Omarchy) does not skip the license and advisory gate.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: Cargo.toml

  # Same target, linker, and musl-tools install as release.yml's
  # x86_64-unknown-linux-musl archive. Builds the TUI package only.
  musl:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build TUI for x86_64-unknown-linux-musl
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p dd_siteforge
