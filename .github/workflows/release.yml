# Build per-target archives and attach them to a GitHub Release.
# install.sh downloads `$bin-$target.tar.gz` from that release.
#
# Triggers:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#   Actions → Release → Run workflow → tag (e.g. v1.8.0)
#
# Linux uses native musl (not cross) so the runner's rustc can compile
# edition 2024. macOS cross-compiles the other Darwin arch with rustup.

name: Release

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (e.g. v1.8.0)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: taiki-e/create-gh-release-action@v1
        with:
          title: $tag
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - name: Install musl-tools
        if: endsWith(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: dd_siteforge
          package: dd_siteforge
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          zip: none
          checksum: sha256
          include: LICENSE,dd_siteforge_theme.yml
          locked: true
          build-tool: cargo
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

  smoke:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - name: Run --version from the linux x86_64 archive
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o pkg.tar.gz \
            "https://github.com/ldnddev/dd_siteforge/releases/download/${TAG}/dd_siteforge-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf pkg.tar.gz
          chmod +x dd_siteforge
          ./dd_siteforge --version

