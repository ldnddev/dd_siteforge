[package]
name = "dd_siteforge_core"
version = "1.33.0"
edition = "2024"
license = "MIT"
publish = false
description = "Site model, validation, export, and init commands shared by dd_siteforge frontends"

[dependencies]
anyhow = "1.0"
handlebars = "6.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-cmark-escape = "0.11"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
