# Lando owns Node for this site. TUI Shift+B runs `lando grunt build`.
#   lando start
#   lando npm install   # first time / after package.json change
#   lando grunt build
#   open https://dd-siteforge.lndo.site  (or http://localhost:8888)
#
# Without this file, Shift+B falls back to host `npx grunt build`.
#
name: dd-siteforge
recipe: lamp

proxy:
  appserver:
    - dd-siteforge.lndo.site

config:
  php: '8.2'
  via: apache
  webroot: web

services:
  appserver:
    ports:
      - '8888:80'
  node:
    type: 'node:20'
    build:
      - npm install

tooling:
  npm:
    service: node
  node:
    service: node
  grunt:
    service: node
