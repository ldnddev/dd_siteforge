[workspace]
members = [
    "crates/ldnddev_theme",
    "crates/dd_siteforge_core",
    "crates/dd_siteforge_gui",
]
# The TUI binary is the root package. The GUI crate is a member so CI and
# `cargo deny` see it, and it stays off this list so `cargo build` and the
# TUI install.sh do not compile GPUI.
default-members = [".", "crates/ldnddev_theme", "crates/dd_siteforge_core"]
resolver = "3"

[package]
name = "dd_siteforge"
version = "1.31.2"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "z" # smaller than "s" (3.4M vs 3.7M)
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# yaml_serde is the YAML organization's maintained fork of serde_yaml.
# The package rename keeps the serde_yaml import path.
serde_yaml = { package = "yaml_serde", version = "0.10" }
ldnddev_theme = { path = "crates/ldnddev_theme", version = "0.1.0" }
dd_siteforge_core = { path = "crates/dd_siteforge_core", version = "1.31.2" }
